[project]
name = "inventory-network-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1",
  "sqlalchemy[asyncio]>=2.0,<3", "asyncpg>=0.29,<1", "psycopg[binary]>=3.2,<4",
  "alembic>=1.13,<2", "pydantic-settings>=2.5,<3",
  "pyomo>=6.7,<7", "highspy>=1.7,<2",
  "openpyxl>=3.1,<4", "python-multipart>=0.0.9,<1"
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27", "aiosqlite>=0.20"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*", "tests*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
